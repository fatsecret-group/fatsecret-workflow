<!DOCTYPE html>
<!--
  Shared skeleton for all feature-workflow plan documents:
  story-analysis.html · design.html · test-plan.html · implementation-plan.html

  HOW TO USE
  - Copy this file's structure for every plan artifact. Keep it SELF-CONTAINED
    (inline CSS only, no external deps) so it opens standalone in a browser.
  - Replace {{TITLE}} (head + <h1>), fill the <nav id="toc"> with the document's
    own sections, and write content inside <main>.
  - Every <h2>/<h3> that the TOC links to MUST carry a matching id="" so the
    anchor jumps work (e.g. <a href="#scope"> → <h3 id="scope">).
  - Use <table> for tabular data, <pre><code> for code blocks, semantic
    headings (h1→h2→h3→h4).

  HELPER CLASSES (already styled below — use them, don't reinvent):
  - p.meta + .meta strong   — the metadata line under <h1> (Stories | Branch | Author | Date)
  - .item-card              — a bordered card for an Executable Item (story-analysis)
  - .task-card              — a bordered card for an implementation Task (implementation-plan)
  - .task-id                — monospace task code inside a task heading (e.g. "Task 3")
  - .items-tag              — small pill tag (Item/Story code) next to a heading
  - .tag                    — small pill tag (inline, general use)
  - .field-label            — bold fixed-width label for "Files:", "Goal:", "Steps:" rows
  - .gate                   — red callout encoding the review→APPROVED→commit→TaskUpdate gate
  - .callout                — yellow note/warning callout
  - status colors           — CSS vars --pass-* / --warn-* / --gate-* for PASS/FAIL/blocked cells
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{TITLE}}</title>
<style>
  :root {
    --sidebar-w: 280px;
    --content-max: 920px;
    --fg: #1f2328;
    --fg-muted: #57606a;
    --bg: #ffffff;
    --bg-soft: #f6f8fa;
    --border: #d0d7de;
    --accent: #0969da;
    --code-bg: #f6f8fa;
    --tag-bg: #ddf4ff;
    --pass-bg: #dafbe1;
    --pass-fg: #1a7f37;
    --warn-bg: #fff8c5;
    --warn-fg: #6d5e0a;
    --gate-bg: #ffebe9;
    --gate-fg: #cf222e;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; line-height: 1.55; color: var(--fg); background: var(--bg); }
  nav#toc { position: fixed; top: 0; left: 0; width: var(--sidebar-w); height: 100vh; overflow-y: auto; padding: 24px 18px; background: var(--bg-soft); border-right: 1px solid var(--border); font-size: 13.5px; }
  nav#toc h2 { margin: 0 0 12px 0; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-muted); font-weight: 600; }
  nav#toc ul { list-style: none; padding: 0; margin: 0; }
  nav#toc ul ul { margin: 4px 0 8px 12px; border-left: 1px solid var(--border); padding-left: 10px; }
  nav#toc li { margin: 4px 0; }
  nav#toc a { color: var(--fg); text-decoration: none; display: block; padding: 3px 6px; border-radius: 4px; }
  nav#toc a:hover { background: #eaeef2; color: var(--accent); }
  nav#toc ul ul a { font-size: 12.5px; color: var(--fg-muted); }
  main { margin-left: var(--sidebar-w); padding: 40px 48px 80px 48px; max-width: calc(var(--sidebar-w) + var(--content-max)); }
  h1 { font-size: 28px; font-weight: 600; margin: 0 0 12px 0; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  h2 { font-size: 21px; font-weight: 600; margin: 36px 0 12px 0; padding-top: 24px; border-top: 1px solid var(--border); }
  h2:first-of-type { border-top: none; padding-top: 0; }
  h3 { font-size: 17px; font-weight: 600; margin: 20px 0 8px 0; }
  h4 { font-size: 14.5px; font-weight: 600; margin: 14px 0 6px 0; color: var(--fg-muted); }
  p { margin: 8px 0; }
  ul, ol { padding-left: 24px; margin: 8px 0; }
  li { margin: 4px 0; }
  hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
  table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 13.5px; }
  th, td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: var(--bg-soft); font-weight: 600; }
  code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
  pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; overflow-x: auto; font-size: 13px; line-height: 1.45; }
  pre code { background: transparent; padding: 0; font-size: inherit; }
  a { color: var(--accent); }
  .meta { color: var(--fg-muted); font-size: 13.5px; margin: 0 0 24px 0; }
  .meta strong { color: var(--fg); }
  .item-card { border: 1px solid var(--border); border-radius: 8px; padding: 18px 22px; margin: 16px 0; background: #fdfdfd; }
  .item-card h3 { margin-top: 0; }
  .task-card { border: 1px solid var(--border); border-radius: 8px; padding: 16px 20px; margin: 14px 0; background: #fdfdfd; }
  .task-card h3 { margin-top: 0; }
  .task-id { font-family: ui-monospace, monospace; font-size: 12px; color: var(--fg-muted); font-weight: 600; }
  .tag, .items-tag { display: inline-block; background: var(--tag-bg); color: var(--accent); font-size: 11.5px; font-weight: 600; padding: 2px 7px; border-radius: 10px; margin-left: 6px; }
  .field-label { font-weight: 600; color: var(--fg-muted); display: inline-block; min-width: 110px; }
  .gate { background: var(--gate-bg); color: var(--gate-fg); padding: 8px 12px; border-radius: 4px; margin-top: 10px; font-size: 13px; font-weight: 600; }
  .callout { background: var(--warn-bg); border-left: 3px solid #d4a72c; padding: 10px 14px; border-radius: 4px; margin: 12px 0; font-size: 13.5px; }
  @media (max-width: 900px) { nav#toc { display: none; } main { margin-left: 0; padding: 24px; } }
</style>
</head>
<body>

<nav id="toc">
  <h2>Contents</h2>
  <ul>
    <!-- One <li><a href="#section-id">Section name</a></li> per top-level section.
         Nest a <ul> for sub-sections. Anchors must match the section ids in <main>. -->
  </ul>
</nav>

<main>

<h1>{{TITLE}}</h1>

<p class="meta">
  <!-- Stories | Branch | Author | Date | Plan folder — separate with &nbsp;|&nbsp; -->
</p>

<!-- Document content. Each TOC-linked heading carries a matching id="". -->

</main>
</body>
</html>
